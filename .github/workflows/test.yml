name: CI

# GitHub Flow: main is always releasable; work happens in short-lived branches via PRs.
# GRPM is a program (nobody imports it): the go.mod `go` line is the exact, patched Go the
# release binaries are built with, and CI tests with it (go-version-file). There is no
# `toolchain` line: setup-go reads the `go` line (see release.yml).
# Linux only: GRPM targets Gentoo Linux.
#
# Required checks on main: "Test" (the gate at the end), "Lint" and "Build". A new
# required job goes into the gate's `needs`, so the branch protection does not change.
# Tool versions are pinned and bumped on purpose in their own PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Never download a newer Go behind our back: the job must run the Go it asked for.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test - ubuntu-latest - Go from go.mod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC — only this job needs it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true
          files: ./coverage.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: go build -o dist/grpm ./cmd/grpm
      - name: Run binary
        run: |
          ./dist/grpm --version
          ./dist/grpm --help > /dev/null
      # Release archives include linux/386 and linux/arm (.goreleaser.yml).
      - name: Build linux/386
        run: CGO_ENABLED=0 GOARCH=386 go build ./...
      - name: Build linux/arm
        run: CGO_ENABLED=0 GOARCH=arm GOARM=7 go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Exact version (golangci-lint docs: "don't start to fail all builds at the same
          # time"). Bump in its own PR that fixes the new findings, and with each new Go
          # minor: an older linter may not understand the new Go.
          version: v2.15.0
          args: --timeout=5m

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go mod tidy changed go.mod/go.sum:"
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum; exit 1
          fi

  # Informational: not in the gate, so a new CVE in a dependency does not block unrelated
  # PRs. A red run is still a task (update the dependency or report). It stays on the
  # latest govulncheck on purpose: the vulnerability data must be current. Releases are
  # protected by the blocking govulncheck in release.yml.
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod

  # The required "Test" check. `if: always()` and the explicit result check matter: a job
  # that is skipped (for example because a job it needs failed) counts as passed for a
  # required check, so a gate without them can let a red PR through.
  gate:
    name: Test
    if: always()
    needs: [test, build, lint, formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "a required job ended with: $r"; exit 1; fi
          done
